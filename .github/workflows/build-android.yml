name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        working-directory: DirectPackageInstaller
        run: |
          dotnet publish DirectPackageInstaller/DirectPackageInstaller.Android/DirectPackageInstaller.Android.csproj \
            -c Release \
            -f net8.0-android \
            -p:AndroidPackageFormats=apk \
            -o ./publish

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DirectPackageInstaller-Android
          path: DirectPackageInstaller/publish/**/*.apk
          if-no-files-found: error
