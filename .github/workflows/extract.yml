name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Extract ZIP
        run: |
          # Busca cualquier archivo .zip y lo descomprime
          ZIPFILE=$(ls *.zip | head -n 1)
          echo "Extrayendo: $ZIPFILE"
          unzip -o "$ZIPFILE"
          rm "$ZIPFILE"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git status
          git commit -m "Extract redesigned source" || echo "No changes to commit"
          git push 
