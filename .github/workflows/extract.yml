name: Extract ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o DPI-Redisenado-para-GitHub.zip
          rm DPI-Redisenado-para-GitHub.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Extract redesigned source" || echo "No changes"
          git push
